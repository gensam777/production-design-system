name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 22: React Native 0.88 / Expo SDK 58 (the @pds/react-native toolchain, ADR 0018)
      # require Node >= 22.13.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm workspaces (ADR 0017): @pds/tokens, @pds/react, @pds/react-native and the Expo
      # preview app @pds/react-native-example. Root scripts delegate to them.
      - name: Build tokens
        run: npm run tokens:build

      # The Swift and Kotlin token outputs are committed sources (platforms/ios, platforms/
      # android) that SwiftPM / Gradle compile without Node. The build just rewrote them, so any
      # diff means a token change was committed without its regenerated native sources.
      - name: Native token sources are committed and current
        run: git diff --exit-code -- platforms/

      # Web CSS/JS must stay byte-identical; React Native / Swift / Kotlin outputs must match
      # their reviewed snapshots and the IR (ADR 0016). Also type-checks the RN output.
      - name: Token tests (snapshots + parity)
        run: npm run tokens:test

      # Cross-platform component contracts (ADR 0015): JSON Schema, no platform API names,
      # semantic + shared token paths in every brand, Figma axes + committed Figma snapshots,
      # and the web reference implementation. The tests add negative cases and Button's
      # cell-by-cell CSS parity (the validator only compares token sets).
      - name: Component contracts
        run: npm run contracts:validate

      - name: Component contract tests
        run: npm run contracts:test

      # Platform-neutral icon catalog (design/icons/, ADR 0019) ↔ the web and React Native
      # IconName unions and Lucide maps, the installed Lucide versions, and the committed
      # SwiftUI icon sources (regenerated from lucide-static and compared).
      - name: Icon catalog tests
        run: npm run icons:test

      # @pds/react-native (Jest + React Native Testing Library): Button behavior, accessibility
      # and contract token parity in both brands.
      - name: React Native tests
        run: npm run test:react-native

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Design audit tests
        run: npm run design:audit:test

      # Figma ↔ code drift audit against the COMMITTED Figma snapshot
      # (scripts/design-audit/snapshots/). Catches code-side drift on every PR. It does NOT
      # contact Figma, so it cannot know whether live Figma changed after the last snapshot
      # refresh — see docs/design-audit.md ("What CI does and does not prove").
      # Warning only: annotates the run when the committed Figma snapshot is older than 14 days.
      # Never fails CI (the script always exits 0; continue-on-error is a second guard). The
      # audit below still runs normally either way.
      - name: Design audit snapshot age
        continue-on-error: true
        run: npm run design:audit:snapshot -- age --max-days 14

      - name: Design audit (Figma ↔ code drift)
        run: npm run design:audit

      - name: Upload design audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-audit-report
          path: design-audit-report.json
          if-no-files-found: ignore

      - name: Build package
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      # Bundles the Expo preview app for iOS and Android (Metro + Hermes, no native toolchain),
      # proving @pds/react-native resolves and compiles in a real React Native app.
      - name: React Native preview (Expo export)
        run: npm run example:react-native:export

  # Native packages (ADR 0016, 0017). Both build the COMMITTED generated sources —
  # `npm run tokens:test` and the "Native token sources" step (validate job) prove they equal
  # what the token build generates — so neither job needs Node.
  swift-tokens:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Repo-root Package.swift (tools 6.0 → Swift 6 language mode). PDSTokens is pure Swift
      # and builds on Linux; PDSUI needs SwiftUI and is built and tested by the swiftui job.
      - name: Build Swift package (PDSTokens)
        run: swift build --target PDSTokens

  # PDSUI (SwiftUI components, ADR 0018): unit tests on the macOS host, then a build for the
  # iOS Simulator (the product platform). Previews are reviewed in Xcode, not in CI.
  swiftui:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Swift tests (PDSUI, macOS host)
        run: swift test

      - name: Build PDSUI for iOS Simulator
        run: xcodebuild -scheme PDSUI -destination 'generic/platform=iOS Simulator' build

  # platforms/android (ADR 0016, 0017, 0018): :tokens (com.pds.tokens, generated + committed)
  # and :compose (com.pds.compose). `build` compiles both, runs Android lint and the unit tests
  # (JVM + Robolectric Compose UI tests). The Android SDK is preinstalled on ubuntu runners.
  # JDK 21: Robolectric's Android SDK 36 runtime requires it; bytecode still targets JVM 17.
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle (wrapper, caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test Gradle project (:tokens, :compose)
        working-directory: platforms/android
        run: ./gradlew build
