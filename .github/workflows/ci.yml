name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build tokens
        run: npm run tokens:build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Design audit tests
        run: npm run design:audit:test

      # Figma ↔ code drift audit against the COMMITTED Figma snapshot
      # (scripts/design-audit/snapshots/). Catches code-side drift on every PR. It does NOT
      # contact Figma, so it cannot know whether live Figma changed after the last snapshot
      # refresh — see docs/design-audit.md ("What CI does and does not prove").
      - name: Design audit (Figma ↔ code drift)
        run: npm run design:audit

      - name: Upload design audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-audit-report
          path: design-audit-report.json
          if-no-files-found: ignore

      - name: Build package
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
