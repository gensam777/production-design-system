name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build tokens
        run: npm run tokens:build

      # Web CSS/JS must stay byte-identical; React Native / Swift / Kotlin outputs must match
      # their reviewed snapshots and the IR (ADR 0016). Also type-checks the RN output.
      - name: Token tests (snapshots + parity)
        run: npm run tokens:test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Design audit tests
        run: npm run design:audit:test

      # Figma ↔ code drift audit against the COMMITTED Figma snapshot
      # (scripts/design-audit/snapshots/). Catches code-side drift on every PR. It does NOT
      # contact Figma, so it cannot know whether live Figma changed after the last snapshot
      # refresh — see docs/design-audit.md ("What CI does and does not prove").
      # Warning only: annotates the run when the committed Figma snapshot is older than 14 days.
      # Never fails CI (the script always exits 0; continue-on-error is a second guard). The
      # audit below still runs normally either way.
      - name: Design audit snapshot age
        continue-on-error: true
        run: npm run design:audit:snapshot -- age --max-days 14

      - name: Design audit (Figma ↔ code drift)
        run: npm run design:audit

      - name: Upload design audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-audit-report
          path: design-audit-report.json
          if-no-files-found: ignore

      - name: Build package
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  # Native token outputs (ADR 0016). These compile the COMMITTED snapshots in
  # scripts/tokens/__tests__/__snapshots__/ — `npm run tokens:test` (validate job) proves the
  # snapshots equal what the build generates, so neither job needs Node or a token build.
  swift-tokens:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Type-check generated Swift (PDSTokens, Swift 6 language mode)
        run: >
          swiftc -typecheck -parse-as-library -swift-version 6 -module-name PDSTokens
          scripts/tokens/__tests__/__snapshots__/swift/PDSTokens/*.swift

  kotlin-tokens:
    runs-on: ubuntu-latest
    env:
      KOTLIN_VERSION: 2.0.21
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Kotlin compiler
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kotlinc.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"

      - name: Compile generated Kotlin (com.pds.tokens)
        run: >
          "$RUNNER_TEMP/kotlinc/bin/kotlinc"
          scripts/tokens/__tests__/__snapshots__/kotlin/com/pds/tokens/*.kt
          -d "$RUNNER_TEMP/pds-tokens.jar"
